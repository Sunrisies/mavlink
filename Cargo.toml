[package]
name = "sunrise-mavlink-server"
version = "0.1.5"
edition = "2024"
build = "build.rs"

[profile.release]
opt-level = "z"   # 优化大小
lto = true        # 链接时优化
codegen-units = 1 # 更好的优化
panic = "abort"   # 减小二进制大小
strip = true      # 去除符号表

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
actix-cors = "0.6"
chrono = "0.4"
# tokio = { version = "1", features = ["full"] }
mavio = { version = "0.5.10" }
anyhow = "1"
maviola = { version = "0.3", features = [
    "async",
    "dlct-ardupilotmega",
    "msrv-mission",
] }
mavspec = "0.1" # 用于处理消息定义
mavlink = { version = "0.16", features = ["ardupilotmega", "common"] }
log = "0.4.29"
log4rs = "1.4.0"
nu-ansi-term = "0.50.3"
rand = "0.10.0"
rumqttc = "0.25.1"
dotenv = "0.15"

[build-dependencies]
serde_json = "1.0"    # 构建脚本也需要
toml_edit = "0.25.11"
semver = "1.0.28"
chrono = "0.4"
